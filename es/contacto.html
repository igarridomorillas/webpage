      <h2>Nos ponemos en contacto</h2>
      <p>Rellena el formulario de debajo y me pondré en contacto contigo lo antes posible.</p>
      <p>(Puedes rellenar bien el e-mail o bien el teléfono)</p>
    </article>
    <form id="contact" method="POST" action=".">
      <dl>
        <dt><label for="name">Nombre:</label><input type="text" name="name" placeholder="Tu nombre" /></dd>
        <dt><label for="email">e-Mail:</label><input type="email" name="email" placeholder="Tu email" /></dt>
        <dt><label for="phone">Teléfono:</label><input type="tel" name="phone" placeholder="Tu número de teléfono" />
        </dt>
        <dt><label for="subject">Motivo de contacto:</label><br /><textarea name="subject"
            placeholder="El motivo de ponerte en contacto conmigo, escribe lo que quieras"></textarea></dt>
        <dt><button id="send" type="submit">Enviar</button></dt>
      </dl>
    </form>
  </section>
