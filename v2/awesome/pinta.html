  <canvas id="screen" width="320" height="200" style="position: absolute; width: 100%; height:100%; background: black;"></canvas>
  <script type="text/javascript">

class Game {
  instance = null;

  static getInstance() {
    if( !Game.instance ) {
      Game.instance = new Game();
    }
    return Game.instance;
  }

  constructor() {
    this.canvas     = document.getElementById('screen');
    this.ctx        = this.canvas.getContext('2d');
    this.rectCanvas = this.canvas.getBoundingClientRect();

    this.board    = [];
    this.initBoard();

    this.player = new Player( this );
    this.blacks = [ new Black( this ) ];
    this.greens = [];
    for( let x = 0; x < 3; x++ ) {
      this.greens.push( new Green( this ) );
    }
    
    window.addEventListener("keydown", this.keyboardController.bind(this) );

    for( let x=0; x<64; x++) {
      for( let y=0; y<38; y++ ) {
        if( this.board[x][y] === 'filled' ) {
          this.ctx.fillStyle = 'rgb(0,88,0)';
          this.ctx.fillRect( x*5, y*5, 5, 5 );
        } 
      }
    }
  
    this.interval = setInterval( this.tick.bind(this), 80 );
  }  //  END constructor

  initBoard() {
    for( let x=0; x<64; x++) {
      const col = [];
      for( let y=0; y<38; y++ ) {
        if( x<2 || y<2 || x>61 || y>35 ) {
          col.push('filled');
        }
        else {
          col.push('void');
        }
      }
      this.board.push( col );
    }
  }  //  END initBoard()

  keyboardController( ev ) {
    if( [38, 39, 40, 37, 32].indexOf(ev.which) >= 0 ) {
      ev.preventDefault();

      if( 38 === ev.which ) {
        this.player.setDirection( 'up' );
      }
      else if( 39 === ev.which ) {
        this.player.setDirection( 'right' );
      }
      else if( 40 === ev.which ) {
        this.player.setDirection( 'down' );
      }
      else if( 37 === ev.which ) {
        this.player.setDirection( 'left' );
      }
      else {
        this.player.setDirection( 'stop' );
      }
    }
  }  //  END keyboardController()

  tick() {
    this.player.tick();
    this.blacks.forEach( (black) => black.tick() );
    this.greens.forEach( (green) => green.tick() );
  }  //  END tick()
}  // END Game

class Player {
  constructor( game ) {
    this.game      = game;
    this.direction = 'stop';
    this.position  = [31,0];
  }  //  END constructor

  setDirection( newDir ) {
    this.direction = newDir;
  }  //  END setDirection

  tick() {
    this.game.ctx.fillStyle = 'rgb(0,88,0)';
    this.game.ctx.fillRect(this.position[0]*5,this.position[1]*5,5,5);

    this.calculateNewPos();
    this.render();
  }

  calculateNewPos() {
    // REMOVE THIS!!!
    this.game.board[ this.position[0] ][ this.position[1] ] = 'filled';
    // REMOVE THIS!!
    if( this.direction === 'left' ) {
      this.position[0]--;
    }
    else if( this.direction === 'right' ) {
      this.position[0]++;
    }
    else if( this.direction === 'up' ) {
      this.position[1]--;
    }
    else if( this.direction === 'down' ) {
      this.position[1]++;
    }
    if( this.position[0] < 0 ) {
      this.position[0] = 0;
      this.direction = 'stop';
    }
    else if( this.position[0] > 63 ) {
      this.position[0] = 63;
      this.direction = 'stop';
    }
    else if( this.position[1] < 0 ) {
      this.position[1] = 0;
      this.direction = 'stop';
    }
    else if( this.position[1] > 37 ) {
      this.position[1] = 37;
      this.direction = 'stop';
    }
  }

  render() {
    this.game.ctx.fillStyle = 'rgb(0,255,0)';
    this.game.ctx.fillRect(this.position[0]*5,this.position[1]*5,5,5);
    this.game.ctx.fillStyle = 'rgb(0,88,0)';
    this.game.ctx.fillRect(this.position[0]*5+1,this.position[1]*5+1,3,3);
  }
}

  calculateNewPosition( terrain ) {
    if( this.direction === 'T-R' ) {
      if( this.position[0] >= 63 ) {

      else if( this.position[1] <= 0 ) {
        this.direction = 'B-R';
      }

        this.direction = 'B-L';

            && this.game.board[ this.position[0]+1 ][ this.position[1]+1 ] === terrain ) {

    if( this.direction === 'T-L' ) {

      }

        this.direction = 'B-L';
      }
      else if( this.game.board[ this.position[0] ][ this.position[1]-1 ] === terrain

      else if( this.position[1] >= 37 ) {
        this.direction = 'T-L';
      }
      else if( this.game.board[ this.position[0] ][ this.position[1]+1 ] === terrain

        // Corner

    /*
    if( this.direction === 'T-R' ) {

        this.direction = 'B-L';

    }

    if( this.direction === 'T-L' ) {
      if( this.position[1] === 0 ) {
        this.direction = 'B-L';
      }
      else if( this.game.board[ this.position[0] ][ this.position[1]-1 ] === 'void' ) {
        this.direction = 'B-L';
      }
      if( this.position[0] === 0 ) {
        this.direction = 'T-R';
      }
      else if( this.game.board[ this.position[0]-1 ][ this.position[1] ] === 'void' ) {
        this.direction = 'T-R';
      }
    }

    if( this.direction === 'B-L' ) {

      else if( this.game.board[ this.position[0] ][ this.position[1]+1 ] === 'void' ) {

    }

    if( this.direction === 'T-R' && this.game.board[ this.position[0]+1 ][ this.position[1]-1 ] === 'void' ) {

    }
    else if( this.direction === 'B-R' && this.game.board[ this.position[0]+1 ][ this.position[1]+1 ] === 'void' ) {

    else if( this.direction === 'T-L' && this.game.board[ this.position[0]-1 ][ this.position[1]-1 ] === 'void' ) {
        this.direction = 'B-R';

    */
  }  //  END calculateNewPosition()

  move() {
    if( this.direction === 'T-R' ) {
      this.position[0]++;
      this.position[1]--;
    }
    else if( this.direction === 'B-R' ) {
      this.position[0]++;
      this.position[1]++;
    }
    else if( this.direction === 'B-L' ) {
      this.position[0]--;
      this.position[1]++;
    }
    else if( this.direction === 'T-L' ) {
      this.position[0]--;
      this.position[1]--;
    }
  }  //  END move()

  render() {
    this.game.ctx.fillStyle = 'rgb(0,0,0)';
    this.game.ctx.fillRect(this.position[0]*5,this.position[1]*5,5,5);
  }  //  END render()
}  //  Black
