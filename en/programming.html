  **Java, Javascript, C, C++, Python**: Son lenguajes de programación.
  
  **¿Qué es un lenguaje de programación?** Pues es la forma que tienen los programadores de decirle al ordenador lo que tiene que hacer una aplicación. Se usan para construir aplicaciones (como el Word, el explorador Firefox o Chrome, un sitio web o los juegos) También para construir las aplicaciones de los móviles (créeme, un móvil es un ordenador chiquitito).
  
  **¿Por qué hay tantos lenguajes de programación?** Pa gustos los colores. Al principio de la informática había pocos. Han ido surgiendo nuevos lenguajes para hacer la tarea de programar más fácil según sea la finalidad del programa.
  C y C++ es para hacer programas muy rápidos (C es de los primeros lenguajes de programación).
  Java mejoró algunas cosas de C y se usa también para hacer todo tipo de programas.
  JavaScript (también se le llama TypeScript) se usa para las páginas web. 
  Python se usa en entornos de análisis de datos (laboratorios, estadísticas, …) y para temas de inteligencia artificial.
  PHP se usa para componer páginas web.
  
  ¿Qué es HTML y CSS? Son otros dos lenguajes para maquetar como se ven las páginas web. A veces, la gente les pone apellidos (HTML5 y CSS3) para indicar la versión. No son lenguajes de programación porque con ellos no se hacen aplicaciones. Creo que, al igual que los anteriores, se pueden dar clases de HTML y CSS en la academia.
  
  ¿C y C++ son lo mismo? No exactamente. C++ está basado en C, pero es algo más moderno. Se creó para incluir programación orientada a objetos (es una forma de programar). También existe C# (C sharp) que es una versión de C que creó Microsoft (esa yo no la conozco: de C sharp nada)
  
  ¿Java y Javascript son lo mismo? No, para nada. Los dos son lenguajes de programación pero son diferentes.
